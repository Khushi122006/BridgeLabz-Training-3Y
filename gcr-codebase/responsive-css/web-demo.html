<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Responsive Web Demo</title>
    <link rel="stylesheet" href="combined-responsive-web-demo.css">
</head>
<body>
    <header>
        <div class="logo">ResponsiveWeb</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Gallery</a>
            <a href="#">Concepts</a>
        </nav>
    </header>

    <main>
        <section class="gallery">
            <h2>Image Gallery</h2>
            <div class="images">
                <img src="https://picsum.photos/id/1015/300/200" alt="Mountain">
                <img src="https://picsum.photos/id/1035/300/200" alt="River">
                <img src="https://picsum.photos/id/1043/300/200" alt="Forest">
            </div>
        </section>

        <section class="explanation">
            <h2>Responsive Design</h2>
            <p>
                Responsive design allows websites to adapt their layout,
                images and text to different screen sizes.
            </p>
        </section>

        <section class="cheat">
            <h2>Cheat Sheet</h2>
            <p>Flexbox → Layout</p>
            <p>Grid → Structure</p>
            <p>Media Queries → Breakpoints</p>
        </section>
    </main>

    <footer>
        <p>Contact: info@example.com</p>
    </footer>
</body>
</html>
