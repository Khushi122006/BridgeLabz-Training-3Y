<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="responsive-design-principles.css">
</head>
<body>
    <main>
        <section class="principles">
            <article>
                <h2>Fluid Layouts</h2>
                <p>Layouts use flexible sizes to adapt to available space.</p>
                <code>width: 100%;</code>
            </article>

            <article>
                <h2>Flexible Media</h2>
                <p>Images and media adjust according to the screen size.</p>
                <code>max-width: 100%;</code>
            </article>

            <article>
                <h2>Breakpoints</h2>
                <p>Breakpoints change the layout for different devices.</p>
                <code>@media (max-width: 600px)</code>
            </article>
        </section>
    </main>
</body>
</html>
