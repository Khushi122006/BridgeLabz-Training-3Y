<!DOCTYPE html>

<head>

    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">

                <img class="gray" src="https://i.pravatar.cc/400?img=12" alt="Profile">

            <article class="profile">
                <img class="sepia" src="https://i.pravatar.cc/400?img=32" alt="Profile">

            <article class="profile">
                <img class="gray" src="https://i.pravatar.cc/400?img=47" alt="Profile">

        </section>
    </main>

</html>
