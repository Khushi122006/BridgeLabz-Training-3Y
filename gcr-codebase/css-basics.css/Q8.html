<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Q8.css">
</head>
<body>

<header>
    <h1>My Dashboard</h1>
</header>

<div class="dashboard">

    <aside>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Reports</a>
        </nav>
    </aside>

    <main class="content">
        <section class="box">
            <h2>Users</h2>
            <p>1,250 Active Users</p>
        </section>

        <section class="box">
            <h2>Projects</h2>
            <p>48 Completed Projects</p>

        <section class="box">
            <h2>Tasks</h2>
            <p>32 Pending Tasks</p>

        <section class="box">

            <p>₹75,000 This Month</p>
        </section>

</div>

</html>
