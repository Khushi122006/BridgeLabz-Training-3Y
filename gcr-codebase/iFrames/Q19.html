<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Form</title>
</head>
<body>

    <h1>Secure Registration Form</h1>

    <form action="#" method="post" autocomplete="off">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="Khushi Pandey" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button>

    </form>

    <p>
        Turning off autocomplete can improve security by preventing the browser
        from automatically storing or filling sensitive information.
    </p>

</body>
</html>
