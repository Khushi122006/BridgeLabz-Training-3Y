<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name" value="Khushi Pandey" required>

        <button type="submit">Submit</button>

    </form>

    <br>

    <iframe
        name="resultFrame"
        width="80%"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
</head>
<body>

    <h1>Form successfully submitted.</h1>

</body>
</html>
