<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="Q6.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
    </header>

    <main>
        <section class="transform-container">

            <div class="transform-item">
                <div class="box rotate-box">Rotate</div>
                <p>Rotate</p>
            </div>

            <div class="transform-item">
                <div class="box scale-box">Scale</div>
                <p>Scale</p>
            </div>

            <div class="transform-item">
                <div class="box translate-box">Translate</div>
                <p>Translate</p>
            </div>

            <div class="transform-item">
                <div class="box skew-box">Skew</div>
                <p>Skew</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Transformation Practice</p>
    </footer>

</body>
</html>
