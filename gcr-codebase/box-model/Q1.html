<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="Q1.css">
</head>
<body>

    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>

    <main>
        <section class="box-container">
            <div class="box solid-box">
                <h2>Solid Border</h2>
                <p>Padding: 20px</p>
            </div>

            <div class="box dashed-box">
                <h2>Dashed Border</h2>
                <p>Padding: 30px</p>
            </div>

            <div class="box double-box">
                <h2>Double Border</h2>
                <p>Padding: 15px</p>
            </div>

            <div class="box groove-box">
                <h2>Groove Border</h2>
                <p>Padding: 25px</p>
            </div>

            <div class="box rounded-box">
                <h2>Rounded Border</h2>
                <p>Border Radius: 20px</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CSS Box Model Practice</p>
    </footer>

</body>
</html>
