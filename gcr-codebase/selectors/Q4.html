<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Q4.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h1>Dashboard</h1>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main class="content">
            <div class="box box-one">
                <h2>Users</h2>
                <p>1,250</p>
            </div>

            <div class="box box-two">
                <h2>Orders</h2>
                <p>850</p>
            </div>

            <div class="box box-three">
                <h2>Revenue</h2>
                <p>₹85,000</p>
            </div>

            <div class="box box-four">
                <h2>Projects</h2>
                <p>24</p>
            </div>

            <div class="box box-five">
                <h2>Performance</h2>
                <p>95%</p>
            </div>
        </main>

    </div>

</body>
</html>
