<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="Q9.css">
</head>
<body>

    <main class="container">

        <div class="flip-card">
            <div class="flip-card-inner">

                <section class="card-front">
                    <img src="https://picsum.photos/400/250" alt="Card Image">
                    <h2>Web Development</h2>
                </section>

                <section class="card-back">
                    <h2>About</h2>
                    <p>
                        Web development is the process of creating
                        websites and web applications using modern
                        technologies.
                    </p>
                </section>

            </div>
        </div>

    </main>

</body>
</html>
