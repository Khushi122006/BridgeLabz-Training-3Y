<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="Q8.css">
</head>
<body>

    <header>
        <h1>Photo Gallery</h1>
    </header>

    <main class="gallery">

        <figure class="photo">
            <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://picsum.photos/id/1018/600/400" alt="Landscape">
            <figcaption>Green Landscape</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
            <figcaption>Lovely Dog</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://picsum.photos/id/1035/600/400" alt="Beach">
            <figcaption>Beach View</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://picsum.photos/id/1040/600/400" alt="Forest">
            <figcaption>Forest</figcaption>
        </figure>

    </main>

</body>
</html>
