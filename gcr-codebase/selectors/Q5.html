<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="Q5.css">
</head>
<body>

    <header>
        <h1>Choose Your Plan</h1>
    </header>

    <main class="pricing">
        <article class="card">
            <h2>Basic</h2>
            <p class="price">₹499</p>
            <p>Basic features</p>
            <p>Email support</p>
            <p>1 User</p>
        </article>

        <article class="card featured">
            <h2>Premium</h2>
            <p class="price">₹999</p>
            <p>All basic features</p>
            <p>Priority support</p>
            <p>5 Users</p>
        </article>

        <article class="card">
            <h2>Enterprise</h2>
            <p class="price">₹1,999</p>
            <p>Advanced features</p>
            <p>24/7 support</p>
            <p>Unlimited Users</p>
        </article>
    </main>

</body>
</html>
